name: Unpack POSTIK Web Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname 'POSTIK_WEB_FIX*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "POSTIK WEB FIX ZIP not found"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Copy website files
        run: |
          set -e

          cp extracted/app.js .
          cp extracted/style.css .
          cp extracted/index.html .

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.js style.css index.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply POSTIK Web Fix V22"
            git push
          fi
